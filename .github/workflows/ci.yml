name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Default GITHUB_TOKEN cannot clone private sibling submodule repos.
      # Requires repo secret SUBMODULES_PAT — see docs/env-by-project.md.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.PAT_TOKEN || github.token }}
          submodules: recursive

      - name: Verify parent layout
        run: |
          test -f .gitmodules
          test -d store-desk-electron
          test -d store-desk-mobile
          test -d store-desk-worker
          test -d store-desk-web
          # Recursive checkout must populate content, not empty gitlink dirs
          test -f store-desk-electron/package.json
          test -f store-desk-worker/package.json
          test -f store-desk-mobile/pubspec.yaml
          test -f store-desk-web/package.json
          echo "Parent StoreDesk layout OK"
