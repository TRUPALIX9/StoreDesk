name: CI

on:
  push:
    branches: [production, develop]
  pull_request:
    branches: [production, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify parent layout
        run: |
          test -f .gitmodules
          test -d store-desk-electron
          test -d store-desk-mobile
          test -d store-desk-worker
          test -d store-desk-web
          test -d store-desk-cloud-backend
          echo "Parent StoreDesk layout OK"
